<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Portfolio of Siddhesh More — full stack and React Native developer building web and hybrid mobile apps from Mumbai, India." />
    <meta name="theme-color" content="#000000" />
    <title>Siddhesh More — Full Stack &amp; Mobile Developer</title>
    <script>
      (function () {
        var t = localStorage.getItem('portfolio-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
