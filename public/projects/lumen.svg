<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Lumen photography portfolio preview">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="32" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- iPad frame -->
  <g filter="url(#shadow)" transform="translate(200 30)">
    <rect width="400" height="300" rx="24" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="2"/>
    <rect x="14" y="14" width="372" height="272" rx="14" fill="#000"/>
    <!-- photo grid -->
    <rect x="26" y="26" width="170" height="120" rx="8" fill="url(#g1)"/>
    <rect x="206" y="26" width="168" height="56" rx="8" fill="url(#g2)"/>
    <rect x="206" y="90" width="80" height="56" rx="8" fill="url(#g3)"/>
    <rect x="294" y="90" width="80" height="56" rx="8" fill="#2c2c2e"/>
    <rect x="26" y="154" width="110" height="120" rx="8" fill="url(#g3)" opacity="0.7"/>
    <rect x="144" y="154" width="110" height="120" rx="8" fill="url(#g1)" opacity="0.6"/>
    <rect x="262" y="154" width="112" height="120" rx="8" fill="url(#g2)" opacity="0.5"/>
  </g>
  <!-- iPhone -->
  <g filter="url(#shadow)" transform="translate(560 140)">
    <rect width="120" height="240" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="2"/>
    <rect x="8" y="8" width="104" height="224" rx="14" fill="#000"/>
    <rect x="16" y="40" width="88" height="160" rx="4" fill="url(#g1)"/>
    <rect x="44" y="16" width="32" height="6" rx="3" fill="#3a3a3c"/>
  </g>
</svg>
