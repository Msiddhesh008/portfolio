<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Pulse analytics dashboard preview">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)" transform="translate(100 40)">
    <rect width="600" height="380" rx="20" fill="url(#bg)" stroke="#2c2c2e" stroke-width="1"/>
  </g>
  <g transform="translate(120 60)">
    <rect width="560" height="340" rx="14" fill="#1d1d1f"/>
    <!-- header -->
    <rect x="24" y="24" width="100" height="8" rx="4" fill="#f5f5f7" opacity="0.9"/>
    <rect x="400" y="20" width="136" height="28" rx="14" fill="#2c2c2e"/>
    <rect x="412" y="30" width="48" height="8" rx="4" fill="#3b82f6"/>
    <!-- chart area -->
    <rect x="24" y="72" width="340" height="200" rx="12" fill="#2c2c2e"/>
    <polyline points="48,220 100,180 160,200 220,120 280,140 340,80" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="48,220 100,200 160,170 220,160 280,150 340,130" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- bars -->
    <rect x="48" y="240" width="24" height="60" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="88" y="220" width="24" height="80" rx="4" fill="#3b82f6" opacity="0.6"/>
    <rect x="128" y="200" width="24" height="100" rx="4" fill="#3b82f6"/>
    <rect x="168" y="230" width="24" height="70" rx="4" fill="#06b6d4" opacity="0.8"/>
    <rect x="208" y="210" width="24" height="90" rx="4" fill="#06b6d4"/>
    <rect x="248" y="190" width="24" height="110" rx="4" fill="#6366f1"/>
    <!-- side panel -->
    <rect x="384" y="72" width="152" height="96" rx="12" fill="#2c2c2e"/>
    <text x="400" y="108" fill="#f5f5f7" font-family="-apple-system,sans-serif" font-size="28" font-weight="600">2.4M</text>
    <rect x="400" y="118" width="80" height="6" rx="3" fill="#86868b"/>
    <rect x="384" y="184" width="152" height="96" rx="12" fill="#2c2c2e"/>
    <text x="400" y="220" fill="#10b981" font-family="-apple-system,sans-serif" font-size="28" font-weight="600">+18%</text>
    <rect x="400" y="230" width="100" height="6" rx="3" fill="#86868b"/>
    <rect x="384" y="296" width="152" height="44" rx="12" fill="#3b82f6" opacity="0.2"/>
    <rect x="400" y="312" width="80" height="8" rx="4" fill="#3b82f6"/>
  </g>
</svg>
