<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Aurora UI design system preview">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
  </defs>
  <!-- MacBook base -->
  <g filter="url(#shadow)" transform="translate(140 60)">
    <rect x="0" y="0" width="520" height="340" rx="18" fill="#3a3a3c"/>
    <rect x="12" y="12" width="496" height="296" rx="10" fill="url(#screen)"/>
    <!-- UI mock -->
    <rect x="32" y="36" width="120" height="8" rx="4" fill="#48484a"/>
    <rect x="32" y="56" width="80" height="6" rx="3" fill="#3a3a3c"/>
    <rect x="32" y="88" width="200" height="120" rx="12" fill="#2c2c2e" stroke="#48484a" stroke-width="1"/>
    <rect x="48" y="104" width="60" height="6" rx="3" fill="#6366f1"/>
    <rect x="48" y="120" width="168" height="4" rx="2" fill="#48484a"/>
    <rect x="48" y="132" width="140" height="4" rx="2" fill="#3a3a3c"/>
    <rect x="48" y="144" width="100" height="24" rx="12" fill="#6366f1" opacity="0.9"/>
    <rect x="252" y="88" width="200" height="120" rx="12" fill="#2c2c2e" stroke="#48484a" stroke-width="1"/>
    <circle cx="280" cy="116" r="16" fill="#8b5cf6" opacity="0.8"/>
    <rect x="304" y="108" width="80" height="6" rx="3" fill="#48484a"/>
    <rect x="304" y="120" width="120" height="4" rx="2" fill="#3a3a3c"/>
    <rect x="252" y="224" width="420" height="56" rx="12" fill="#2c2c2e" stroke="#48484a" stroke-width="1"/>
    <rect x="268" y="240" width="48" height="24" rx="6" fill="#ec4899" opacity="0.7"/>
    <rect x="324" y="240" width="48" height="24" rx="6" fill="#3b82f6" opacity="0.7"/>
    <rect x="380" y="240" width="48" height="24" rx="6" fill="#10b981" opacity="0.7"/>
    <!-- chin -->
    <path d="M180 340h160c0 8-36 14-80 14s-80-6-80-14z" fill="#48484a"/>
    <rect x="200" y="354" width="120" height="6" rx="3" fill="#3a3a3c"/>
  </g>
  <!-- floating card -->
  <g filter="url(#shadow)" transform="translate(520 120)">
    <rect width="200" height="140" rx="16" fill="#f5f5f7"/>
    <rect x="16" y="16" width="48" height="48" rx="12" fill="#6366f1" opacity="0.15"/>
    <rect x="24" y="28" width="32" height="4" rx="2" fill="#6366f1"/>
    <rect x="24" y="36" width="24" height="4" rx="2" fill="#6366f1" opacity="0.5"/>
    <rect x="16" y="80" width="100" height="6" rx="3" fill="#1d1d1f" opacity="0.8"/>
    <rect x="16" y="94" width="168" height="4" rx="2" fill="#86868b"/>
    <rect x="16" y="106" width="140" height="4" rx="2" fill="#d2d2d7"/>
  </g>
</svg>
