<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Orbit collaboration app preview">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- back phone -->
  <g filter="url(#shadow)" transform="translate(280 80) rotate(-8 70 120)">
    <rect width="140" height="280" rx="22" fill="#2c2c2e" stroke="#48484a" stroke-width="1.5"/>
    <rect x="10" y="10" width="120" height="260" rx="16" fill="#1d1d1f"/>
    <rect x="50" y="18" width="40" height="6" rx="3" fill="#3a3a3c"/>
    <rect x="20" y="48" width="100" height="8" rx="4" fill="#48484a"/>
    <rect x="20" y="68" width="80" height="6" rx="3" fill="#3a3a3c"/>
    <rect x="20" y="100" width="100" height="60" rx="10" fill="#2c2c2e"/>
    <rect x="20" y="180" width="100" height="60" rx="10" fill="#2c2c2e"/>
  </g>
  <!-- front phone -->
  <g filter="url(#shadow)" transform="translate(380 50)">
    <rect width="160" height="320" rx="26" fill="#1d1d1f" stroke="#6366f1" stroke-width="2"/>
    <rect x="12" y="12" width="136" height="296" rx="18" fill="#000"/>
    <rect x="56" y="20" width="48" height="6" rx="3" fill="#3a3a3c"/>
    <!-- chat UI -->
    <rect x="24" y="48" width="80" height="36" rx="12" fill="#2c2c2e"/>
    <rect x="32" y="58" width="56" height="6" rx="3" fill="#86868b"/>
    <rect x="32" y="68" width="40" height="4" rx="2" fill="#48484a"/>
    <rect x="56" y="96" width="96" height="48" rx="12" fill="#6366f1" opacity="0.25"/>
    <rect x="64" y="106" width="72" height="6" rx="3" fill="#6366f1"/>
    <rect x="64" y="118" width="56" height="4" rx="2" fill="#8b5cf6" opacity="0.7"/>
    <rect x="24" y="156" width="88" height="40" rx="12" fill="#2c2c2e"/>
    <rect x="32" y="166" width="64" height="6" rx="3" fill="#86868b"/>
    <!-- avatars -->
    <circle cx="40" cy="240" r="14" fill="#3b82f6"/>
    <circle cx="72" cy="240" r="14" fill="#10b981"/>
    <circle cx="104" cy="240" r="14" fill="#ec4899"/>
    <circle cx="120" cy="240" r="14" fill="#48484a" stroke="#6366f1" stroke-width="1.5"/>
    <!-- input bar -->
    <rect x="24" y="268" width="112" height="32" rx="16" fill="#2c2c2e"/>
    <rect x="36" y="280" width="64" height="6" rx="3" fill="#48484a"/>
    <circle cx="120" cy="284" r="10" fill="#6366f1"/>
  </g>
</svg>
